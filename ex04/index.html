<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="style.css" rel="stylesheet">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="container">
        <h1>Task Manager</h1>
            <label for="enter-task">
                <input type="text" id="enter-task" placeholder="Enter a new task...">
            </label>
            <button type="button" id="add-button">Add Task</button>
            <ul id="task-list">
            </ul>
            <div>
                <p>Total Tasks count: <span id="total-task">0</span></p>
            </div>
        </div>
    </body>
</html>
